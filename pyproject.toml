[project]
name = "gekigrade"
version = "0.1.0"
description = "Local-first, LLM-directed, deterministic photo correction and grading"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "OpenImageIO==3.1.16.0",
  "opencolorio==2.5.2",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.scripts]
geki = "gekigrade.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pillow>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gekigrade"]

[tool.hatch.build.targets.wheel.force-include]
"looks" = "gekigrade/looks"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises installed imaging tools and the CLI workflow",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gekigrade"]

[[tool.mypy.overrides]]
module = "PyOpenColorIO"
ignore_missing_imports = true
